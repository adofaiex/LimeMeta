name: 缺陷报告
description: 报告可复现的 LimeMeta 问题
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: 安全漏洞请使用 Security 私密报告，不要在这里提交。
  - type: input
    id: version
    attributes:
      label: LimeMeta 版本
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 环境
      description: .NET SDK、操作系统、数据库及版本
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期行为
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际行为与日志
      description: 请先删除凭证、连接串和个人数据
    validations:
      required: true
