Urls: "http://*:6675"

LimeMeta:
  ConnectionString: "Host=localhost;Port=5432;Database=limemeta_service_dev;Username=postgres;Password=postgres"
  DataType: "PostgreSQL"
  FileStorePath: "./FileStore"
  FileStoreCount: 8192
  FileStore:
    Provider: "Local"
    Local:
      Path: "./FileStore"
      Count: 8192
    Pan123Cli:
      Command: "pan123"
      ParentFileId: 0
      UseDirectLink: true
      TempPath: "./TempUpload"
      Overwrite: false
  AdminPerm: "管理员"
  GuestPerm: "游客"
  AdminUserName: "admin"
  AdminUserPassword: "change-me-admin-password"
  DefaultUserPassword: "change-me-user-password"
  AutoSyncSchema: true
  LoadSeedOnStartup: true
  WebSocket:
    Path: "/api/ws"
    MaxMessageSize: 1048576
