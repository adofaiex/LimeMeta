# User.yaml
# 用途：初始化用户数据，对应模型 LimeMeta.Models.User。
#
# 字段说明：
# - id: 用户固定 ID，必须是 Guid。固定 ID 方便其它种子文件引用。
# - name: 用户显示名称。
# - username: 登录用户名。
# - password: 密码字段不建议写在种子里。未填写时，新增用户会使用 LimeMeta:DefaultUserPassword 的 MD5 值。
#
# 说明：
# 管理员用户不需要写在这里。框架启动时会自动根据配置创建管理员用户：
# - LimeMeta:AdminUserName
# - LimeMeta:AdminUserPassword
#
# 示例：
# - id: 11111111-1111-1111-1111-111111111111
#   name: 审核员
#   username: reviewer

[]
