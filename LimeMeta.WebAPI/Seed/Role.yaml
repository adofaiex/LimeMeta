# Role.yaml
# 用途：初始化角色数据，对应模型 LimeMeta.Models.Role。
#
# 字段说明：
# - id: 角色固定 ID，必须是 Guid。
# - name: 角色名称。
# - sn: 排序号，可选。
# - parentId: 父级角色 ID，可选；填写后会形成角色树。
#
# 说明：
# 管理员角色不需要写在这里。框架启动时会自动根据 LimeMeta:AdminPerm 创建管理员角色。
# 游客角色建议保留。新增普通用户时，如果没有显式分配角色，框架会尝试自动分配“游客”角色。

- id: 019c404e-da35-72a9-8fe7-c0941aa0de11
  name: 游客
  sn: 100
