# Perm.yaml
# 用途：初始化权限数据，对应模型 LimeMeta.Models.Perm。
#
# 字段说明：
# - id: 权限固定 ID，必须是 Guid。
# - name: 权限名称，例如“谱面审核”“用户管理”。
# - sn: 排序号，可选。
# - parentId: 父级权限 ID，可选；填写后会形成权限树。
#
# 说明：
# 管理员权限不需要写在这里。框架启动时会自动根据 LimeMeta:AdminPerm 创建管理员权限。
#
# 示例：
# - id: 22222222-2222-2222-2222-222222222222
#   name: 谱面上传
#   sn: 10
# - id: 33333333-3333-3333-3333-333333333333
#   name: 谱面审核
#   sn: 20

[]
