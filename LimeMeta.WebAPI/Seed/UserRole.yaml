# UserRole.yaml
# 用途：初始化用户和角色的绑定关系，对应模型 LimeMeta.Models.UserRole。
#
# 字段说明：
# - id: 关系固定 ID，必须是 Guid。
# - userId: 用户 ID，对应 User.yaml 或数据库中已有用户的 id。
# - roleId: 角色 ID，对应 Role.yaml 或数据库中已有角色的 id。
#
# 说明：
# 管理员用户与管理员角色的绑定不需要写在这里，框架启动时会自动创建。
#
# 示例：
# - id: 44444444-4444-4444-4444-444444444444
#   userId: 11111111-1111-1111-1111-111111111111
#   roleId: 55555555-5555-5555-5555-555555555555

[]
