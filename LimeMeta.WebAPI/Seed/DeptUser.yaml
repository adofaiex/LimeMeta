# DeptUser.yaml
# 用途：初始化部门和用户的绑定关系，对应模型 LimeMeta.Models.DeptUser。
#
# 字段说明：
# - id: 关系固定 ID，必须是 Guid。
# - deptId: 部门 ID，对应 Dept.yaml 或数据库中已有部门的 id。
# - userId: 用户 ID，对应 User.yaml 或数据库中已有用户的 id。
#
# 说明：
# 如果项目不需要组织架构，保持空数组即可。
#
# 示例：
# - id: 88888888-8888-8888-8888-888888888888
#   deptId: 77777777-7777-7777-7777-777777777777
#   userId: 11111111-1111-1111-1111-111111111111

[]
