# RolePerm.yaml
# 用途：初始化角色和权限的绑定关系，对应模型 LimeMeta.Models.RolePerm。
#
# 字段说明：
# - id: 关系固定 ID，必须是 Guid。
# - roleId: 角色 ID，对应 Role.yaml 或数据库中已有角色的 id。
# - permId: 权限 ID，对应 Perm.yaml 或数据库中已有权限的 id。
#
# 说明：
# 管理员角色与管理员权限的绑定不需要写在这里，框架启动时会自动创建。
#
# 示例：
# - id: 66666666-6666-6666-6666-666666666666
#   roleId: 55555555-5555-5555-5555-555555555555
#   permId: 33333333-3333-3333-3333-333333333333

[]
