- id: 019e4429-0d53-73ab-a152-86544a8046ef
  name: 请假单
  workflow: |
    # 请假流程

    ## 流程分支
    - **部长** 发起人：起草 → 上级领导审批 → 人力资源审批 → 完成
    - **其他** 发起人（正式员工、副部长）：起草 → 部门审批 → 人力资源审批 → 完成

    ## 1. 起草
    - **状态**: 起草
    - **签核者**: 发起人（本部门「正式员工」、「副部长」或「部长」）
    - **说明**: 填写并提交请假单；部长不走部门审批，改走上级领导审批

    ## 2. 部门审批
    - **状态**: 部门审批
    - **适用**: 发起人角色 ≠「部长」
    - **签核类型**: 或签
    - **签核者**: 本部门「部长」或「副部长」（任一同意即可）
    - **同意**: 下一节点（人力资源审批）
    - **拒绝**: 上一节点

    ## 3. 上级领导审批
    - **状态**: 上级领导审批
    - **适用**: 发起人角色 =「部长」
    - **签核类型**: 定签
    - **签核者**: 上一级领导（「总经理」）
    - **说明**: 部长无本部门更高职级审批人，由角色上级「总经理」签核
    - **同意**: 下一节点（人力资源审批）
    - **拒绝**: 上一节点

    ## 4. 人力资源审批
    - **状态**: 人力资源审批
    - **签核类型**: 或签
    - **签核者**: 「人力资源部」的「部长」或「副部长」（任一同意即可）
    - **同意**: 流转完成
    - **拒绝**: 上一节点
