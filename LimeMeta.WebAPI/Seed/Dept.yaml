# Dept.yaml
# 用途：初始化部门数据，对应模型 LimeMeta.Models.Dept。
#
# 字段说明：
# - id: 部门固定 ID，必须是 Guid。
# - name: 部门名称。
# - parentId: 父级部门 ID，可选；填写后会形成部门树。
# - sn: 排序号，可选。
# - alias: 部门别名，可选。
# - phone/address/email/avatar/note: 部门扩展信息，可选。
#
# 说明：
# 如果项目不需要组织架构，保持空数组即可，不会创建任何部门数据。
#
# 示例：
# - id: 77777777-7777-7777-7777-777777777777
#   name: 内容审核组
#   sn: 10

[]
